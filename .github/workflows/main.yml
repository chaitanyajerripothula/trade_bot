name: End-to-End Institutional Pre-Open Suite

on:
  schedule:
    # 1. Run at 11:00 AM UTC (04:30 PM IST) Monday to Friday to calculate & update ADV
    - cron: '0 11 * * 1-5'
    
    # 2. Run at 03:37 AM UTC (09:07:00 AM IST) Monday to Friday for Live Monitoring
    - cron: '37 3 * * 1-5'
    
  workflow_dispatch: # Allows you to manually trigger a test run anytime via the GitHub UI

jobs:
  execute_suite:
    runs-on: ubuntu-latest

    steps:
    - name: Access Repository Source Code
      uses: actions/checkout@v3

    - name: Initialize Stable Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Inject Core Quantitative Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas yfinance

    # BRANCH A: IF IT IS 4:30 PM IST -> FETCH & UPDATE ADV
    - name: Evening Phase - Harvest and Commit Rolling 20-Day ADV
      if: github.event.schedule == '0 11 * * 1-5'
      run: |
        python generate_adv.py
        
        # Configure local git layer to securely push the updated CSV back to your repo
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add fno_adv.csv
        git commit -m "System Sync: Automatically updated historical 20-Day ADV vectors" || echo "No changes detected"
        git push

    # BRANCH B: IF IT IS 09:07 AM IST OR MANUALLY TRIGGERED -> RUN LIVE PRE-OPEN MONITOR
    - name: Morning Phase - Scan Pre-Open with Dynamic Offset
      if: github.event.schedule == '37 3 * * 1-5' || github.event_name == 'workflow_dispatch'
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        sleep 15
        python pre_open_monitor.py
