name: End-to-End Institutional Pre-Open Suite

# GitHub's built-in `schedule` cron is best-effort and often 1–3 hours late.
# For on-time pre-open runs, trigger this workflow via workflow_dispatch from a
# free external cron (cron-job.org) — see README.

on:
  schedule:
    # Fallback only — expect multi-hour drift on GitHub-hosted cron.
    - cron: '0 11 * * 1-5'      # evening ADV intent (16:30 IST)
    - cron: '37 3 * * 1-5'      # morning monitor intent (09:07 IST)

  workflow_dispatch:
    inputs:
      phase:
        description: 'Which phase to run'
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: write

jobs:
  execute_suite:
    runs-on: ubuntu-latest

    steps:
    - name: Access Repository Source Code
      uses: actions/checkout@v4

    - name: Initialize Stable Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Inject Core Quantitative Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas yfinance

    - name: Resolve phase
      id: phase
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          PHASE="${{ inputs.phase }}"
        elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
          PHASE="evening"
        else
          PHASE="morning"
        fi
        echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
        echo "Resolved phase: $PHASE (event=${{ github.event_name }})"

    - name: Evening Phase - Harvest and Commit Rolling 20-Day ADV
      if: steps.phase.outputs.phase == 'evening'
      run: |
        python generate_adv.py
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add fno_adv.csv
        git commit -m "System Sync: Automatically updated historical 20-Day ADV vectors" || echo "No changes detected"
        git push

    - name: Morning Phase - Scan Pre-Open with Dynamic Offset
      if: steps.phase.outputs.phase == 'morning'
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        python pre_open_monitor.py
